[pytest]
# Historical harness tests that encode superseded designs are deselected by
# exact node ID (visible as "deselected" in every run). Owner decision 6 of
# 2026-11-08; reasons in docs/remediation/HISTORICAL_TESTS.md.
addopts = --import-mode=importlib
    --deselect=docs/remediation/m3_2b_r4/test_mutation_harness.py::MutationHarnessTests::test_adversarial_harness_mutations_are_rejected
    --deselect=docs/remediation/m3_2b_r4/test_mutation_harness.py::MutationHarnessTests::test_three_way_reachability_is_repeated_and_phase_separated
    --deselect=docs/remediation/m3_2b_r6/test_binding_guard.py::BindingGuardTests::test_public_result_has_four_binding_cases_and_stale_rejection
    --deselect=docs/remediation/m3_f04_impl_r2/test_interface_migration.py::F04InterfaceMigrationTests::test_blueprint_uses_migrated_public_schemas
    --deselect=docs/remediation/m3_f04_impl_r4/test_supplemental_entrypoints.py::SupplementalMatrixTests::test_each_new_case_has_an_explicit_contract_guard
    --deselect=docs/remediation/m3_f04_impl_r4/test_supplemental_entrypoints.py::SupplementalMatrixTests::test_every_supplemental_case_against_applied_public_entrypoint
pythonpath =
    .
    docs/remediation/m3_f05_design_r2
    docs/remediation/m3_f04_fixtures_r1
    scripts/audit
