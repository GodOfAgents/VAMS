[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"

optimizer = true
optimizer_runs = 200

# Required for openzeppelin-foundry-upgrades
ast = true
build_info = true
extra_output = ["storageLayout"]
ffi = true

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
polygon = { key = "${POLYGONSCAN_API_KEY}" }
