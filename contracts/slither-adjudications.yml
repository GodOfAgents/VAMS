  rationale: 'Re-verified 2026-11-09. Each local relies on Solidity zero/empty initialization by design:
    decoder structs returned empty on failure (callers check the ok flag), counters and sort indices starting
    at zero, a previous-value sentinel of zero, Expected/Receipt structs filled field by field before
    use, and try/catch results assigned before use with zero rejected: the accepted replay value in ComposedSettlement
