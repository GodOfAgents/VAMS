  rationale: VAMSInsuranceFund.executePayout computes the INV-2 30% cap as q*3000 + floor(r*3000/10000)
    with B = q*10000 + r, which equals floor(B*3000/10000) exactly; the split avoids overflow and loses
    no precision.
