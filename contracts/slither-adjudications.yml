  rationale: 'Re-verified 2026-11-09. EffectReceiptV3.verify does not revert, so each site was checked:
    ObjectEffectV3.providerReceipt, terminalAbsence and verifyFenceUpdate return verify''s (ok, digest)
    to callers that check ok (absence() rejects each failure; acknowledgement stores valid). ActionDeliveryVerifierV1.verifyObjectAbsenceV3
    returns absence()''s result. Where issuer()''s validity flag is discarded the issuer id is bytes32(0),
    which EffectReceiptV3._validExpected rejects, and verify re-derives and checks the key. ECDSA.tryRecover
    discards only the error argument while the RecoverError is checked. decodePrincipal and getAgent discard
    unrelated tuple fields after checking ok/owner.'
