name: VAMS Security & Build Gates

on:
  workflow_dispatch:
    inputs:
      release_stage:
        description: Promotion stage to evaluate
        required: true
        default: canary
        type: choice
        options:
          - canary
          - public
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify PR Changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$BASE_SHA"
          head="$HEAD_SHA"
          mapfile -t changed_files < <(git diff --name-only "$base" "$head")

          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docs_only=true
          for file in "${changed_files[@]}"; do
            case "$file" in
              docs/*|README.md|REPO_STATUS_REPORT.md|audit.md|AGENTS.md|PROOF_OF_AUTHORSHIP.md|.github/SECURITY.md|contracts/CONTRACTS.md|contracts/README.md|cardano/README.md|cdk-deployment/README.md|frontend-vite/README.md|neuron/README.md|neuron/DOCS.md|neuron/docs/*.md|neuron/*/README.md) ;;
              *) docs_only=false; break ;;
            esac
          done

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  audit-program-gate:
    name: Audit Program Integrity
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Audit Test Dependencies
        run: |
          python -m pip install pip==26.1.2
          python -m pip install git-filter-repo==2.47.0

      - name: Validate Audit Program
        run: |
          python scripts/audit/audit_program.py validate

      - name: Run Audit Program Regression Tests
        run: |
          python scripts/audit/test_audit_program.py

      - name: Validate Deployment Ceremony Source
        run: |
          python scripts/audit/deployment_readiness.py
          python scripts/audit/test_deployment_readiness.py

      - name: Validate Architecture And Invariant Traceability
        run: |
          python scripts/audit/validate_traceability.py
          python scripts/audit/test_traceability.py

      - name: Validate Documentation Reality
        run: |
          python scripts/docs/validate_docs.py
          python -m unittest scripts/docs/test_validate_docs.py

      - name: Validate VDSO Review Evidence
        run: |
          python scripts/docs/validate_vdso_evidence.py
          python -m unittest discover -s scripts/docs/tests -p "test_validate_vdso_evidence.py"

      - name: Validate Workflow Supply Chain
        run: |
          python scripts/audit/validate_workflow_security.py
          python scripts/audit/test_workflow_security.py

      - name: Test Economic Concentration Controls
        run: |
          python scripts/audit/test_economic_concentration.py
          python scripts/audit/test_economic_adversarial.py
          python scripts/audit/run_economic_adversarial.py \
            --epochs 100000 \
            --seed 20260711 \
            --output economic-adversarial-report.json

      - name: Upload Economic Adversarial Evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: economic-adversarial-report
          path: economic-adversarial-report.json
          retention-days: 365

      - name: Validate Agent Red-Team Corpus
        run: |
          python scripts/audit/validate_agent_red_team.py

      - name: Run Complete Audit Regression Suite
        run: |
          python -m unittest discover -s scripts/audit -p "test_*.py"

  docs-gate:
    name: Docs Verification
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify Team Docs Diff
        if: github.event_name == 'pull_request' && needs.changes.outputs.docs_only == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          base="$BASE_SHA"
          head="$HEAD_SHA"
          mapfile -t changed_files < <(git diff --name-only "$base" "$head")

          for file in "${changed_files[@]}"; do
            case "$file" in
              docs/*|README.md|REPO_STATUS_REPORT.md|audit.md|AGENTS.md|PROOF_OF_AUTHORSHIP.md|.github/SECURITY.md|contracts/CONTRACTS.md|contracts/README.md|cardano/README.md|cdk-deployment/README.md|frontend-vite/README.md|neuron/README.md|neuron/DOCS.md|neuron/docs/*.md|neuron/*/README.md) ;;
              *) echo "Unexpected non-docs file in docs-only gate: $file" >&2; exit 1 ;;
            esac
          done

          git diff --check "$base" "$head"

      - name: Validate Documentation Reality
        run: |
          python scripts/docs/validate_docs.py

  public-content-policy:
    name: Public Content Policy
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Public Content Policy Scan
        run: |
          python scripts/security/public_content_policy_scan.py

  default-credential-scan:
    name: Default Credential Scan
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Default Credential Scan
        run: |
          python scripts/security/default_credential_scan.py
          python scripts/security/secret_history_prevention_scan.py

  mock-mode-promotion-scan:
    name: Mock-Mode Promotion Scan
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Mock-Mode Promotion Scan
        run: |
          python scripts/security/mock_mode_promotion_scan.py

  secret-scanning:
    name: Secret Scanning (GitLeaks)
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch Complete Git History
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --force --tags origin

      - name: Install Pinned GitLeaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/gitleaks_checksums.txt" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          (cd "$RUNNER_TEMP" && cp gitleaks.tar.gz gitleaks_8.30.1_linux_x64.tar.gz && sha256sum --check --ignore-missing gitleaks_checksums.txt)
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks

      - name: Verify Narrow GitLeaks Allowlists
        run: python scripts/security/gitleaks_allowlist_regression.py

      - name: Run Complete-History GitLeaks
        id: gitleaks_scan
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw-gate
          gitleaks git . --config .gitleaks.toml --redact=100 \
            --report-format json --report-path raw-gate/gitleaks-report.json \
            --log-opts=--all --exit-code 1
          test -s raw-gate/gitleaks-report.json

      - name: Upload GitLeaks Raw Gate Evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-gate-gitleaks
          path: raw-gate/gitleaks-report.json
          if-no-files-found: error
          retention-days: 365

      - name: Enforce GitLeaks Result
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.gitleaks_scan.outcome }}
        run: test "$SCAN_OUTCOME" = "success"

  trufflehog-scanning:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch Complete Git History
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --force --tags origin

      - name: Install Pinned TruffleHog
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/trufflehog.tar.gz" https://github.com/trufflesecurity/trufflehog/releases/download/v3.95.9/trufflehog_3.95.9_linux_amd64.tar.gz
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/trufflehog_checksums.txt" https://github.com/trufflesecurity/trufflehog/releases/download/v3.95.9/trufflehog_3.95.9_checksums.txt
          (cd "$RUNNER_TEMP" && cp trufflehog.tar.gz trufflehog_3.95.9_linux_amd64.tar.gz && sha256sum --check --ignore-missing trufflehog_checksums.txt)
          tar -xzf "$RUNNER_TEMP/trufflehog.tar.gz" -C "$RUNNER_TEMP" trufflehog
          sudo install -m 0755 "$RUNNER_TEMP/trufflehog" /usr/local/bin/trufflehog

      - name: Run Complete-History All-Category TruffleHog
        id: trufflehog_scan
        continue-on-error: true
        run: |
          python scripts/security/trufflehog_gate.py \
            --output raw-gate/trufflehog-sanitized.json

      - name: Upload TruffleHog Sanitized Gate Evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-gate-trufflehog
          path: raw-gate/trufflehog-sanitized.json
          if-no-files-found: error
          retention-days: 365

      - name: Enforce TruffleHog Result
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.trufflehog_scan.outcome }}
        run: test "$SCAN_OUTCOME" = "success"

  solidity-gate:
    name: Solidity (Forge) Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1

      - name: Compile and Test
        run: |
          cd contracts
          forge build --sizes
          forge test -vvv

  slither-gate:
    name: Solidity Static Analysis (Slither)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Slither
        run: |
          python -m pip install pip==26.1.2
          pip install slither-analyzer==0.11.5

      - name: Run Slither
        run: |
          cd contracts
          slither . --exclude-dependencies --exclude-informational --exclude-low \
            --fail-high --json slither-report.json

      - name: Upload Slither Evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slither-evidence
          path: |
            contracts/slither-report.json
            contracts/slither-adjudications.yml
          if-no-files-found: warn
          retention-days: 365

  aiken-gate:
    name: Aiken (Cardano) Verification
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Aiken
        uses: aiken-lang/setup-aiken@1728a4be43be099752e22d8b841706caaa6fdd88 # v1
        with:
          version: 'v1.1.21'

      - name: Run Verification & Tests
        run: |
          cd cardano
          aiken check --deny --seed 20260711 --max-success 250

  vir-core-gate:
    name: VIR Core Determinism & Conformance
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Pinned Rust Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          cargo +1.92.0 install cargo-audit --version 0.22.2 --locked

      - name: Verify VIR Core
        shell: bash
        run: |
          set -euo pipefail
          cd vams-vm
          cargo +1.92.0 fmt --all -- --check
          cargo +1.92.0 check --workspace --all-targets --locked
          cargo +1.92.0 clippy --workspace --all-targets --locked -- -D warnings
          cargo +1.92.0 test --workspace --all-targets --locked
          cargo +1.92.0 audit --deny warnings

  python-gate:
    name: Python Security Audit & Tests
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install pip==26.1.2
          pip install pytest==9.1.1 pytest-asyncio==1.4.0 anyio==4.14.1
          pip install httpx==0.28.1 httpx2==2.5.0 bandit==1.9.4 pip-audit==2.10.1
          pip install -r gateway/requirements.txt
          pip install -r neuron/requirements.txt

      - name: Run Pip Audit
        run: |
          pip-audit -r gateway/requirements.txt
          pip-audit -r neuron/requirements.txt

      - name: Run Bandit (Security Linter)
        run: |
          bandit -r neuron/ gateway/ -ll -ii

      - name: Run PyTest Suite
        run: |
          pytest -v --tb=short

  semgrep-gate:
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: |
          python -m pip install pip==26.1.2
          pip install semgrep==1.169.0

      - name: Run Reviewed Semgrep Gate
        run: |
          semgrep scan --metrics off --config .semgrep/vams-security.yml --error \
            --json --output semgrep-reviewed.json \
            --exclude contracts/lib \
            --exclude node_modules \
            --exclude frontend-vite/node_modules \
            --exclude .foundry \
            --exclude frontend-vite/.vite \
            --exclude contracts/out \
            --exclude .git

      - name: Run Semgrep Discovery Scan
        continue-on-error: true
        run: |
          semgrep scan --metrics off --config auto \
            --json --output semgrep-discovery.json \
            --exclude contracts/lib \
            --exclude node_modules \
            --exclude frontend-vite/node_modules \
            --exclude .foundry \
            --exclude frontend-vite/.vite \
            --exclude contracts/out \
            --exclude .git

      - name: Upload Semgrep Evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-evidence
          path: |
            semgrep-reviewed.json
            semgrep-discovery.json
            .semgrep/discovery-adjudications.yml
          if-no-files-found: warn
          retention-days: 365

  frontend-gate:
    name: JS/Frontend Verification
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          cd frontend-vite
          npm ci

      - name: Audit NPM Packages
        run: |
          cd frontend-vite
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Lint Frontend
        run: |
          cd frontend-vite
          npm run lint

      - name: Build Verification
        run: |
          cd frontend-vite
          npm run build

  gateway-config-gate:
    name: Gateway Caddy Config Check
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Adapt Caddy Config
        run: |
          mkdir -p "$RUNNER_TEMP/caddy-ci"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -subj "/CN=VAMS CI Root" -days 1 \
            -keyout "$RUNNER_TEMP/caddy-ci/ca-key.pem" \
            -out "$RUNNER_TEMP/caddy-ci/ca.pem"

          docker run --rm \
            -v "$PWD/gateway/Caddyfile.testnet.example:/etc/caddy/Caddyfile:ro" \
            -v "$RUNNER_TEMP/caddy-ci/ca.pem:/etc/caddy/certs/vams-root-ca.crt:ro" \
            -e VAMS_GATEWAY_DOMAIN=localhost \
            -e VAMS_ROOT_CA_CERT=/etc/caddy/certs/vams-root-ca.crt \
            caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

          docker run --rm \
            -v "$PWD/gateway/Caddyfile.testnet.example:/etc/caddy/Caddyfile:ro" \
            -v "$RUNNER_TEMP/caddy-ci/ca.pem:/etc/caddy/certs/vams-root-ca.crt:ro" \
            -e VAMS_GATEWAY_DOMAIN=localhost \
            -e VAMS_ROOT_CA_CERT=/etc/caddy/certs/vams-root-ca.crt \
            caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
            caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --pretty

  sbom-generation:
    name: SBOM Generation & Signing
    runs-on: ubuntu-latest
    needs: [changes, solidity-gate, slither-gate, aiken-gate, vir-core-gate, python-gate, semgrep-gate, frontend-gate, gateway-config-gate]
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: 'cyclonedx-json'
          output-file: 'sbom.json'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign SBOM Blob
        run: |
          cosign sign-blob --yes --oidc-provider github-actions \
            --bundle sbom.sigstore.json \
            sbom.json

      - name: Upload Signed SBOM Evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-sbom
          path: |
            sbom.json
            sbom.sigstore.json
          retention-days: 365

  security-evidence-gate:
    name: Security Evidence Gate
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      id-token: write
    needs:
      - changes
      - docs-gate
      - audit-program-gate
      - public-content-policy
      - default-credential-scan
      - mock-mode-promotion-scan
      - secret-scanning
      - trufflehog-scanning
      - solidity-gate
      - slither-gate
      - aiken-gate
      - vir-core-gate
      - python-gate
      - semgrep-gate
      - frontend-gate
      - gateway-config-gate
      - sbom-generation
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
      DOCS_GATE: ${{ needs.docs-gate.result }}
      AUDIT_PROGRAM: ${{ needs.audit-program-gate.result }}
      PUBLIC_CONTENT: ${{ needs.public-content-policy.result }}
      DEFAULT_CREDENTIALS: ${{ needs.default-credential-scan.result }}
      MOCK_MODE: ${{ needs.mock-mode-promotion-scan.result }}
      GITLEAKS: ${{ needs.secret-scanning.result }}
      TRUFFLEHOG: ${{ needs.trufflehog-scanning.result }}
      SOLIDITY: ${{ needs.solidity-gate.result }}
      SLITHER: ${{ needs.slither-gate.result }}
      AIKEN: ${{ needs.aiken-gate.result }}
      VIR_CORE: ${{ needs.vir-core-gate.result }}
      PYTHON: ${{ needs.python-gate.result }}
      SEMGREP: ${{ needs.semgrep-gate.result }}
      FRONTEND: ${{ needs.frontend-gate.result }}
      GATEWAY_CONFIG: ${{ needs.gateway-config-gate.result }}
      SBOM: ${{ needs.sbom-generation.result }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate Commit-Bound Evidence Manifest
        run: |
          python scripts/audit/audit_program.py manifest \
            --output audit-evidence.json \
            --result audit-program="$AUDIT_PROGRAM" \
            --result public-content="$PUBLIC_CONTENT" \
            --result default-credentials="$DEFAULT_CREDENTIALS" \
            --result mock-mode="$MOCK_MODE" \
            --result gitleaks="$GITLEAKS" \
            --result trufflehog="$TRUFFLEHOG" \
            --result solidity="$SOLIDITY" \
            --result slither="$SLITHER" \
            --result aiken="$AIKEN" \
            --result vir-core="$VIR_CORE" \
            --result python="$PYTHON" \
            --result semgrep="$SEMGREP" \
            --result frontend="$FRONTEND" \
            --result gateway-config="$GATEWAY_CONFIG" \
            --result sbom="$SBOM"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Audit Evidence
        run: |
          cosign sign-blob --yes --oidc-provider github-actions \
            --bundle audit-evidence.sigstore.json \
            audit-evidence.json

      - name: Upload Audit Evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testnet-audit-evidence
          path: |
            audit-evidence.json
            audit-evidence.sigstore.json
          retention-days: 365

      - name: Enforce Required Job Results
        shell: bash
        run: |
          set -euo pipefail

          always_required=(
            AUDIT_PROGRAM DOCS_GATE PUBLIC_CONTENT DEFAULT_CREDENTIALS MOCK_MODE
            GITLEAKS TRUFFLEHOG
          )
          for name in "${always_required[@]}"; do
            if [[ "${!name}" != "success" ]]; then
              echo "$name did not pass: ${!name}" >&2
              exit 1
            fi
          done

          if [[ "$DOCS_ONLY" != "true" ]]; then
            full_required=(
              SOLIDITY SLITHER AIKEN VIR_CORE PYTHON SEMGREP FRONTEND
              GATEWAY_CONFIG SBOM
            )
            for name in "${full_required[@]}"; do
              if [[ "${!name}" != "success" ]]; then
                echo "$name did not pass: ${!name}" >&2
                exit 1
              fi
            done
          fi

  testnet-readiness-gate:
    name: Testnet ${{ inputs.release_stage }} Readiness Gate
    runs-on: ubuntu-latest
    needs: security-evidence-gate
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Signed Audit Evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testnet-audit-evidence
          path: docs/audit/evidence

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify Audit Evidence Signature
        run: |
          cosign verify-blob \
            --bundle docs/audit/evidence/audit-evidence.sigstore.json \
            --certificate-identity-regexp '^https://github.com/GodOfAgents/VAMS/.github/workflows/security-gates.yml@refs/.+$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            docs/audit/evidence/audit-evidence.json

      - name: Verify Closed Canary Signature
        if: inputs.release_stage == 'public'
        run: |
          cosign verify-blob \
            --bundle docs/audit/evidence/closed-canary-report.sigstore.json \
            --certificate-identity-regexp '^https://github.com/GodOfAgents/VAMS/.github/workflows/.+@refs/.+$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            docs/audit/evidence/closed-canary-report.json

      - name: Require Stage-Specific Evidence
        env:
          RELEASE_STAGE: ${{ inputs.release_stage || 'canary' }}
        run: |
          python scripts/audit/audit_program.py readiness \
            --stage "$RELEASE_STAGE"
