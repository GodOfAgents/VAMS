name: VAMS Security & Build Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write # Required for Cosign keyless signing

jobs:
  secret-scanning:
    name: Secret Scanning (GitLeaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  solidity-gate:
    name: Solidity (Forge) Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Compile and Test
        run: |
          cd contracts
          forge build --sizes
          forge test -vvv

  aiken-gate:
    name: Aiken (Cardano) Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Aiken
        uses: txpipe/setup-aiken@v1
        with:
          version: 'v1.1.21'

      - name: Run Verification & Tests
        run: |
          cd cardano
          aiken check

  python-gate:
    name: Python Security Audit & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio anyio httpx bandit pip-audit
          pip install -r gateway/requirements.txt
          pip install -r neuron/requirements.txt

      - name: Run Pip Audit
        run: |
          pip-audit

      - name: Run Bandit (Security Linter)
        run: |
          bandit -r neuron/ gateway/ -ll -ii

      - name: Run PyTest Suite
        run: |
          pytest -v --tb=short

  frontend-gate:
    name: JS/Frontend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          cd frontend-vite
          npm ci

      - name: Audit NPM Packages
        run: |
          cd frontend-vite
          npm audit --audit-level=high

      - name: Build Verification
        run: |
          cd frontend-vite
          npm run build

  sbom-generation:
    name: SBOM Generation & Signing
    runs-on: ubuntu-latest
    needs: [solidity-gate, aiken-gate, python-gate, frontend-gate]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          format: 'cyclonedx-json'
          output-file: 'sbom.json'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign SBOM Blob
        run: |
          cosign sign-blob --yes --oidc-provider github-actions sbom.json
