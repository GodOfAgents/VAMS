name: VAMS Security & Build Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write # Required for Cosign keyless signing

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify PR Changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          mapfile -t changed_files < <(git diff --name-only "$base" "$head")

          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docs_only=true
          for file in "${changed_files[@]}"; do
            if [[ ! "$file" =~ ^docs/team/.+\.md$ ]]; then
              docs_only=false
              break
            fi
          done

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  docs-gate:
    name: Docs Verification
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs_only == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Team Docs Diff
        shell: bash
        run: |
          set -euo pipefail

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          mapfile -t changed_files < <(git diff --name-only "$base" "$head")

          for file in "${changed_files[@]}"; do
            if [[ ! "$file" =~ ^docs/team/.+\.md$ ]]; then
              echo "Unexpected non-docs file in docs-only gate: $file" >&2
              exit 1
            fi
          done

          git diff --check "$base" "$head" -- docs/team

  public-content-policy:
    name: Public Content Policy
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Public Content Policy Scan
        run: |
          python scripts/security/public_content_policy_scan.py

  default-credential-scan:
    name: Default Credential Scan
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Default Credential Scan
        run: |
          python scripts/security/default_credential_scan.py

  mock-mode-promotion-scan:
    name: Mock-Mode Promotion Scan
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Mock-Mode Promotion Scan
        run: |
          python scripts/security/mock_mode_promotion_scan.py

  secret-scanning:
    name: Secret Scanning (GitLeaks)
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trufflehog-scanning:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog Filesystem Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified --fail

  solidity-gate:
    name: Solidity (Forge) Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Compile and Test
        run: |
          cd contracts
          forge build --sizes
          forge test -vvv

  slither-gate:
    name: Solidity Static Analysis (Slither)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Slither
        run: |
          python -m pip install --upgrade pip
          pip install slither-analyzer

      - name: Run Slither
        run: |
          cd contracts
          slither . --exclude-dependencies --exclude-informational --exclude-low --fail-high

  aiken-gate:
    name: Aiken (Cardano) Verification
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Aiken
        uses: txpipe/setup-aiken@v1
        with:
          version: 'v1.1.21'

      - name: Run Verification & Tests
        run: |
          cd cardano
          aiken check

  python-gate:
    name: Python Security Audit & Tests
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio anyio httpx bandit pip-audit
          pip install -r gateway/requirements.txt
          pip install -r neuron/requirements.txt

      - name: Run Pip Audit
        run: |
          pip-audit

      - name: Run Bandit (Security Linter)
        run: |
          bandit -r neuron/ gateway/ -ll -ii

      - name: Run PyTest Suite
        run: |
          pytest -v --tb=short

  semgrep-gate:
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan --config auto --error \
            --exclude contracts/lib \
            --exclude node_modules \
            --exclude frontend-vite/node_modules \
            --exclude contracts/out \
            --exclude .git

  frontend-gate:
    name: JS/Frontend Verification
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          cd frontend-vite
          npm ci

      - name: Audit NPM Packages
        run: |
          cd frontend-vite
          npm audit --audit-level=high

      - name: Build Verification
        run: |
          cd frontend-vite
          npm run build

  gateway-config-gate:
    name: Gateway Caddy Config Check
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Adapt Caddy Config
        run: |
          docker run --rm \
            -v "$PWD/gateway/Caddyfile.testnet.example:/etc/caddy/Caddyfile:ro" \
            caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

          docker run --rm \
            -v "$PWD/gateway/Caddyfile.testnet.example:/etc/caddy/Caddyfile:ro" \
            caddy:2 \
            caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --pretty

  sbom-generation:
    name: SBOM Generation & Signing
    runs-on: ubuntu-latest
    needs: [changes, solidity-gate, slither-gate, aiken-gate, python-gate, semgrep-gate, frontend-gate, gateway-config-gate]
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          format: 'cyclonedx-json'
          output-file: 'sbom.json'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign SBOM Blob
        run: |
          cosign sign-blob --yes --oidc-provider github-actions sbom.json
